<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Sistema de gestão para assistência técnica e loja de acessórios">
  <title>Nandos Tech | Gestão</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="authGate" class="auth-gate" hidden aria-live="polite"></section>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img class="brand-logo" src="./Captura%20de%20Tela%202026-11-25%20a%CC%80s%2020.02.40.png" alt="Logo Nandos Tech"><div><strong>Nandos Tech</strong><small>GESTÃO INTELIGENTE</small></div></div>
      <nav id="nav">
        <button class="nav-item active" data-page="dashboard">▦ <span>Dashboard</span></button>
        <button class="nav-item" data-page="products">▣ <span>Produtos e peças</span></button>
        <button class="nav-item" data-page="services">⚙ <span>Serviços</span></button>
        <button class="nav-item" data-page="customers">♙ <span>Clientes</span></button>
        <button class="nav-item" data-page="quotes">▤ <span>Orçamentos</span></button>
        <button class="nav-item" data-page="sales">▣ <span>Vendas · PDV</span></button>
        <button class="nav-item" data-page="cash">＄ <span>Caixa</span></button>
      </nav>
      <div class="sidebar-foot"><span class="status-dot"></span> Dados salvos neste dispositivo</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="menuBtn" aria-label="Abrir menu">☰</button>
        <div><small class="eyebrow">PAINEL DE CONTROLE</small><h1 id="pageTitle">Visão geral</h1></div>
        <div class="top-actions"><span id="today"></span><button class="primary" id="quickQuote">＋ Novo orçamento</button></div>
      </header>
      <section id="page" class="page"></section>
      <footer>Nandos Tech · Gestão para assistência técnica</footer>
    </main>
  </div>
  <dialog id="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" id="closeModal">×</button></div><div id="modalBody"></div></dialog>
  <div id="toast" class="toast"></div>
  <script>
    // Carrega a biblioteca de autenticação com uma segunda origem caso a primeira falhe.
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Falha ao carregar ' + src));
        document.head.appendChild(script);
      });
    }
    async function startNandosApp() {
      const gate = document.querySelector('#authGate');
      const shell = document.querySelector('.app-shell');
      try {
        try {
          await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
        } catch (firstError) {
          await loadScript('https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js');
        }
        await loadScript('./supabase-config.js');
        await loadScript('./app.js');
      } catch (error) {
        console.error('Falha ao iniciar o Nandos Tech:', error);
        shell.style.display = 'none';
        gate.hidden = false;
        gate.innerHTML = '<div class="auth-card"><div class="auth-brand"><div class="auth-brand-mark">🐵</div><div><h1>Nandos Tech</h1><p>GESTÃO INTELIGENTE</p></div></div><h2>Não foi possível iniciar o sistema</h2><p>A conexão com a biblioteca de autenticação falhou. Atualize a página em instantes. Seus dados não foram apagados.</p></div>';
      }
    }
    startNandosApp();
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.error));
    }
  </script>
</body>
</html>
